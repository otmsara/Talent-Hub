server:
  port: 8086

spring:
  application:
    name: job-service
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:h2:mem:jobdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

management:
  tracing:
    enabled: false
  logging:
    loki:
      enabled: false

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.validation: DEBUG
    com.valhko.jobservice: DEBUG
    org.hibernate: DEBUG
    org.hibernate.SQL: DEBUG

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: full
  circuitbreaker:
    enabled: true

resilience4j:
  circuitbreaker:
    instances:
      userService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 10000
  retry:
    instances:
      userService:
        maxAttempts: 3
        waitDuration: 1000

user:
  validation:
    enabled: false
  service:
    url: http://localhost:8091

eureka:
  client:
    enabled: false
